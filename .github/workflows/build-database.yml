name: Build FamousGuess Database

on:
  workflow_dispatch:

  push:
    paths:
      - "source_data/**"
      - "tools/build_database.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build FamousGuess database
        run: python tools/build_database.py

      - name: Commit generated database
        run: |
          git config user.name "FamousGuess Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/generated/

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Build FamousGuess database"
            git push
          fi
